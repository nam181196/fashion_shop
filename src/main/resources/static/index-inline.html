<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BankRate - Demo (Inline)</title>
  <style>
  :root{ --bg:#f7fafc; --card:#fff; --muted:#666; --accent:#0b66ff }
  body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;margin:0;background:var(--bg);color:#111}
  .container{max-width:900px;margin:32px auto;padding:20px}
  header h1{margin:0 0 4px}
  .muted{color:var(--muted)}
  .controls{display:flex;gap:8px;margin:12px 0}
  input#q{flex:1;padding:8px;border:1px solid #ddd;border-radius:4px}
  button{padding:8px 12px;background:var(--accent);color:#fff;border:0;border-radius:4px}
  table{width:100%;border-collapse:collapse;margin-top:12px}
  th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
  .hidden{display:none}
  footer{margin-top:18px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>BankRate — Demo</h1>
      <p class="muted">Danh sách ngân hàng (từ API)</p>
    </header>

    <main>
      <div class="controls">
        <input id="q" placeholder="Tìm theo mã hoặc tên" />
        <button id="refresh">Làm mới</button>
      </div>

      <div id="status">Đang tải...</div>
      <table id="banks" class="hidden">
        <thead>
          <tr><th>Code</th><th>Name</th><th>Website</th><th>Active</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>

    <footer>
      <small>Actuator: <a href="/actuator/health" target="_blank">/actuator/health</a> • Swagger: <a href="/swagger-ui.html" target="_blank">/swagger-ui.html</a></small>
    </footer>
  </div>

  <script>
  async function fetchBanks(){const statusEl=document.getElementById('status');const table=document.getElementById('banks');const tbody=table.querySelector('tbody');statusEl.textContent='Đang tải...';table.classList.add('hidden');tbody.innerHTML='';try{const res=await fetch('/api/v1/banks');const json=await res.json();if(!json||!json.data)throw new Error('No data');const banks=json.data;statusEl.textContent=`Tìm thấy ${banks.length} ngân hàng`;banks.forEach(b=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${escapeHtml(b.code)}</td><td>${escapeHtml(b.name)}</td><td><a href="${escapeAttr(b.website)}" target="_blank">${escapeHtml(b.website)}</a></td><td>${b.active? '✅':'❌'}</td>`;tbody.appendChild(tr)});table.classList.remove('hidden')}catch(e){statusEl.textContent='Lỗi khi tải dữ liệu: '+e.message}}function escapeHtml(s){if(!s)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]);}function escapeAttr(s){return escapeHtml(s);}document.getElementById('refresh').addEventListener('click',fetchBanks);document.getElementById('q').addEventListener('input',(e)=>{const q=e.target.value.trim().toLowerCase();const rows=document.querySelectorAll('#banks tbody tr');rows.forEach(r=>{const text=r.textContent.toLowerCase();r.style.display=(!q||text.includes(q))?'':'none';});});window.addEventListener('load',()=>{fetchBanks()});
  </script>
</body>
</html>
